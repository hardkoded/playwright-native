name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-*
  merge_group:
  pull_request:
    paths:
    - '**.yml'
    - '**.cs'
    - '**.json'
    - '**.csproj'
    - '**.runsettings'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  # Pin BrowserFetcher's cache to a job-local path so actions/cache can
  # restore the binaries deterministically across runs.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

jobs:
  build:
    name: ${{ matrix.browser }}-${{ matrix.mode }}-${{ matrix.os }}${{ matrix.shardTotal && format('-shard{0}of{1}', matrix.shardIndex, matrix.shardTotal) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium — full coverage on Linux + Windows, headless + headful.
          # Linux headless now finishes the full suite at ~2h and aborts on
          # TestSessionTimeout with 0 failures; 2-way class shards restore
          # headroom (same filter step as Windows / macOS WebKit).
          - { os: ubuntu-latest,  browser: chromium, mode: headless, shardIndex: 1, shardTotal: 2 }
          - { os: ubuntu-latest,  browser: chromium, mode: headless, shardIndex: 2, shardTotal: 2 }
          - { os: ubuntu-latest,  browser: chromium, mode: headful,  shardIndex: 1, shardTotal: 2 }
          - { os: ubuntu-latest,  browser: chromium, mode: headful,  shardIndex: 2, shardTotal: 2 }
          # Windows runs much slower per-test than Linux and never reaches
          # the end of the suite before the org's CI timeout kills the job
          # (observed: ~40% done at the ~2h cutoff). Split into shards by
          # test class so each one finishes with headroom to spare.
          - { os: windows-latest, browser: chromium, mode: headless, shardIndex: 1, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headless, shardIndex: 2, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headless, shardIndex: 3, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headless, shardIndex: 4, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headful,  shardIndex: 1, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headful,  shardIndex: 2, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headful,  shardIndex: 3, shardTotal: 4 }
          - { os: windows-latest, browser: chromium, mode: headful,  shardIndex: 4, shardTotal: 4 }
          # WebKit — full test suite against the protocol stack.
          # macOS + Linux headless. Expect failures until WebKit catches up.
          # macOS also hits the CI timeout even at a 3-way split (observed:
          # one shard still ~92% done at cutoff -- it draws a disproportionate
          # cluster of client-cert/TLS tests that hang ~30s each on macOS's
          # Kestrel TLS 1.3 limitation). 5-way spreads that load thinner.
          - { os: macos-14,       browser: webkit,   mode: headless, shardIndex: 1, shardTotal: 5 }
          - { os: macos-14,       browser: webkit,   mode: headless, shardIndex: 2, shardTotal: 5 }
          - { os: macos-14,       browser: webkit,   mode: headless, shardIndex: 3, shardTotal: 5 }
          - { os: macos-14,       browser: webkit,   mode: headless, shardIndex: 4, shardTotal: 5 }
          - { os: macos-14,       browser: webkit,   mode: headless, shardIndex: 5, shardTotal: 5 }
          - { os: ubuntu-latest,  browser: webkit,   mode: headless }
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Install ffmpeg (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Bypass Chocolatey — community.chocolatey.org regularly 504s on the
        # ffmpeg package and can still exit 0, which made retries ineffective.
        $ErrorActionPreference = 'Stop'
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
        $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $downloaded = $false
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          Write-Host "Downloading ffmpeg (attempt $attempt/5) from $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            $downloaded = $true
            break
          } catch {
            Write-Warning "Download failed: $($_.Exception.Message)"
            if ($attempt -eq 5) { throw }
            Start-Sleep -Seconds (15 * $attempt)
          }
        }
        if (-not $downloaded) { throw 'ffmpeg download failed' }
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $bin = Get-ChildItem -Path $dir -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
        if (-not $bin) { throw 'ffmpeg.exe not found after extract' }
        Add-Content -Path $env:GITHUB_PATH -Value $bin.Directory.FullName
        & $bin.FullName -version
        $probe = Join-Path $bin.Directory.FullName 'ffprobe.exe'
        if (Test-Path $probe) { & $probe -version }
    - name: Install ffmpeg (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install ffmpeg
        # Recent Homebrew ffmpeg bottles omit --enable-libwebp; cwebp covers
        # screenshot WebP recoding when ffmpeg lacks that encoder.
        brew install webp
        ffmpeg -version
        ffprobe -version
        cwebp -version
    - name: Install system dependencies (Linux, Chromium)
      if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev xvfb ffmpeg webp
    - name: Install system dependencies (Linux, WebKit)
      if: matrix.os == 'ubuntu-latest' && matrix.browser == 'webkit'
      run: |
        sudo apt-get update
        # Ubuntu 24.04 WebKit deps. Mirrors upstream Playwright's nativeDeps.ts
        # (ubuntu24.04-x64). Re-sync against
        # microsoft/playwright/packages/playwright-core/src/server/registry/nativeDeps.ts
        # when the Ubuntu release bumps — package names change between LTS
        # versions (e.g. libgles2-mesa → libgles2, libevent-2.1-7 →
        # libevent-2.1-7t64). We intentionally do NOT swallow apt failures: a
        # missing package means the browser will crash at runtime with an
        # obscure dynamic-loader error.
        sudo apt-get install -y \
          ffmpeg \
          webp \
          gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          libatk-bridge2.0-0t64 libatk1.0-0t64 libatomic1 libavif16 libcairo-gobject2 libcairo2 \
          libdbus-1-3 libdrm2 libenchant-2-2 libepoxy0 libevent-2.1-7t64 libflite1 \
          libfontconfig1 libfreetype6 libgbm1 libgdk-pixbuf-2.0-0 libgles2 libglib2.0-0t64 \
          libgstreamer-gl1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer1.0-0 \
          libgtk-4-1 libharfbuzz-icu0 libharfbuzz0b libhyphen0 libicu74 libjpeg-turbo8 \
          liblcms2-2 libmanette-0.2-0 libopus0 libpango-1.0-0 libpangocairo-1.0-0 libpng16-16t64 \
          libsecret-1-0 libvpx9 libwayland-client0 libwayland-egl1 libwayland-server0 \
          libwebp7 libwebpdemux2 libwoff1 libx11-6 libx264-164 libxkbcommon0 libxml2 libxslt1.1
    - name: Cache browser binaries
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        # Re-key whenever pinned revisions (BrowserData.cs) OR the extraction
        # logic (ArchiveExtractor.cs) change. The latter matters because zips
        # produced before the symlink fix were cached as broken trees on Linux:
        # libWPEWebKit-2.0.so.1 ended up as a 26-byte text placeholder and the
        # dynamic loader rejected it as "file too short".
        key: ${{ runner.os }}-pw-browsers-${{ hashFiles('src/PlaywrightNative/BrowserData.cs', 'src/PlaywrightNative/ArchiveExtractor.cs') }}
        # No restore-keys fallback: we want a stale cache to be a clean miss
        # rather than a partial restore that masks broken binaries.
    - name: Create HTTPS certificate (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p src/PlaywrightNative.TestServer
        dotnet dev-certs https --clean
        # PKCS12 with private key for Kestrel. Public DER alone makes the
        # handshake abort (ERR_CONNECTION_CLOSED / TLS EOF).
        dotnet dev-certs https -ep src/PlaywrightNative.TestServer/key.pfx -p playwright
        dotnet dev-certs https -ep src/PlaywrightNative.TestServer/testCert.cer
        # Do NOT install testCert into the system CA store. WebKit/libsoup
        # trusts OS CAs, so a system-trusted "bad SSL" cert makes page.goto
        # succeed and breaks ShouldFailWhenNavigatingToBadSsl /
        # ignoreHTTPSErrors isolation (caughtException null). Chromium keeps
        # its own root store and was unaffected. Tests that need HTTPS to
        # succeed must use IgnoreHTTPSErrors (upstream parity).
    - name: Create HTTPS certificate (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        dotnet dev-certs https --clean
        # Export PKCS12 so SimpleServer.LoadHttpsCertificate can feed Kestrel a
        # private key. Public-only testCert.cer / PEM rematerialization still
        # yields ERR_CONNECTION_CLOSED on Windows runners.
        New-Item -ItemType Directory -Force -Path src/PlaywrightNative.TestServer | Out-Null
        dotnet dev-certs https -ep src/PlaywrightNative.TestServer/key.pfx -p playwright
        dotnet dev-certs https -ep src/PlaywrightNative.TestServer/testCert.cer
    - name: Create HTTPS certificate (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        mkdir -p src/PlaywrightNative.TestServer
        dotnet dev-certs https --clean
        dotnet dev-certs https -ep src/PlaywrightNative.TestServer/key.pfx -p playwright
        dotnet dev-certs https -ep src/PlaywrightNative.TestServer/testCert.cer
    - name: Check formatting
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.mode == 'headless' }}
      run: dotnet format whitespace ./src/PlaywrightNative.sln --verify-no-changes && dotnet format style ./src/PlaywrightNative.sln --verify-no-changes
    - name: Check no puppeteer references
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium' && matrix.mode == 'headless' }}
      run: |
        chmod +x ./.github/workflows/no-puppeteer.sh
        ./.github/workflows/no-puppeteer.sh
    - name: Build
      run: dotnet build ./src/PlaywrightNative.sln -c Release
    - name: Compute test shard filter
      if: matrix.shardTotal
      shell: bash
      env:
        # Git Bash's MSYS layer auto-converts any argument that looks like a
        # POSIX path (e.g. "/ListFullyQualifiedTests") into a bogus Windows
        # path before exec'ing a native tool. Disable that for this step.
        MSYS_NO_PATHCONV: "1"
        SHARD_INDEX: ${{ matrix.shardIndex }}
        SHARD_TOTAL: ${{ matrix.shardTotal }}
      run: |
        chmod +x ./.github/workflows/compute-test-shard-filter.sh
        ./.github/workflows/compute-test-shard-filter.sh
    - name: Disable AppArmor (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
    - name: Test (Chromium, Linux headless)
      if: ${{ matrix.browser == 'chromium' && matrix.os == 'ubuntu-latest' && matrix.mode == 'headless' }}
      env:
        PRODUCT: CHROMIUM
      run: |
        ./.github/workflows/dotnet-test-with-retries.sh
    - name: Test (Chromium, Linux headful)
      if: ${{ matrix.browser == 'chromium' && matrix.os == 'ubuntu-latest' && matrix.mode == 'headful' }}
      env:
        PRODUCT: CHROMIUM
        HEADLESS: "false"
      run: |
        ./.github/workflows/dotnet-test-with-retries.sh \
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" --
    - name: Test (Chromium, Windows)
      if: ${{ matrix.browser == 'chromium' && matrix.os == 'windows-latest' }}
      shell: bash
      env:
        PRODUCT: CHROMIUM
        HEADLESS: ${{ matrix.mode == 'headless' && 'true' || 'false' }}
      run: |
        ./.github/workflows/dotnet-test-with-retries.sh
    - name: Test (WebKit)
      if: matrix.browser == 'webkit'
      shell: bash
      env:
        PRODUCT: WEBKIT
      run: |
        # Raise the soft FD limit. Failed tests dispose+relaunch the worker
        # browser; without enough headroom, macOS runners hit EMFILE mid-suite
        # even after pipe/transport disposal fixes.
        ulimit -n 65536 || true
        # Known-failing tests on WebKit are marked in PlaywrightNative.Nunit's
        # TestExpectations.local.json (browser+platform+mode aware). The JSON
        # currently covers WK feature gaps (ExposeFunction, AddInitScript,
        # AddScriptTag/AddStyleTag, EmulateMedia, PDF, screenshots, SetContent,
        # SetViewportSize) and the macOS-14 inner-target hang. Retire entries
        # as the underlying work lands.
        ./.github/workflows/dotnet-test-with-retries.sh
